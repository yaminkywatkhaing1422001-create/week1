<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile Card</title>

  <style>
    body {
      font-family: sans-serif;
      background-color: #f0fdf4;
      display: flex;
      justify-content: center;
      padding: 50px;
    }

    .card {
      background-color: white;
      width: 300px;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #15803d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #1e293b;
    }

    .role {
      color: #64748b;
      font-size: 14px;
    }

    hr {
      border: 0;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
    }

    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .badge {
      background-color: #dcfce7;
      color: #15803d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="avatar">Y</div>

    <h2 class="name">YA MIN KYAWT KHAING</h2>

    <p class="role">
      Computer Engineering Student
      <br>
      Gachon University
    </p>

    <hr>

    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Fetcher</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px #00000015;
    }

    h1 { color: #4338ca; }
    #setup { font-size: 20px; font-weight: bold; }
    #punchline { font-size: 18px; color: #7c3aed; }

    button {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      margin: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background: #4338ca; }
    button:disabled { opacity: 0.5; cursor: wait; }

    #saveBtn { background: #059669; }
    #message { color: #dc2626; }

    .spinner {
      display: none;
      width: 35px;
      height: 35px;
      margin: 15px auto;
      border: 4px solid #ddd;
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>😂 Random Joke Fetcher</h1>
    <p>Click the button to get a random joke!</p>

    <button id="loadBtn" onclick="loadJoke()">Load Joke</button>

    <div id="spinner" class="spinner"></div>
    <p id="loading"></p>
    <p id="setup"></p>
    <p id="punchline"></p>
    <p id="message" role="status"></p>

    <button id="saveBtn" onclick="saveFavourite()" hidden>
      ❤️ Save Favourite
    </button>
    <p id="savedMessage"></p>
  </div>

  <script>
    let currentJoke = null;

    async function loadJoke() {
      const loadBtn = document.getElementById("loadBtn");
      const spinner = document.getElementById("spinner");

      loadBtn.disabled = true;
      spinner.style.display = "block";
      document.getElementById("loading").textContent = "Loading...";
      document.getElementById("setup").textContent = "";
      document.getElementById("punchline").textContent = "";
      document.getElementById("message").textContent = "";
      document.getElementById("savedMessage").textContent = "";
      document.getElementById("saveBtn").hidden = true;
      currentJoke = null;

      try {
        const response = await fetch(
          "https://official-joke-api.appspot.com/random_joke"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        document.getElementById("setup").textContent = data.setup;
        document.getElementById("punchline").textContent = data.punchline;

        currentJoke = data;
        document.getElementById("saveBtn").hidden = false;

      } catch (error) {
        document.getElementById("message").textContent =
          "Sorry! Could not load a joke. Please try again.";

      } finally {
        spinner.style.display = "none";
        document.getElementById("loading").textContent = "";
        loadBtn.disabled = false;
      }
    }

    function saveFavourite() {
      if (!currentJoke) return;

      try {
        const favourites = JSON.parse(
          localStorage.getItem("favouriteJokes") || "[]"
        );

        favourites.push(currentJoke);

        localStorage.setItem(
          "favouriteJokes",
          JSON.stringify(favourites)
        );

        document.getElementById("savedMessage").textContent =
          "❤️ Joke saved successfully!";
      } catch (error) {
        document.getElementById("savedMessage").textContent =
          "Could not save this joke.";
      }
    }
  </script>
</body>
</html>

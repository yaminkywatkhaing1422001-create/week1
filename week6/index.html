<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Joke Fetcher - Week 6</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    text-align: center;
    padding: 50px 15px;
    margin: 0;
  }

  .container {
    background: white;
    max-width: 500px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px #cccccc;
  }

  h1 {
    color: #333333;
  }

  button {
    background: #6366f1;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    font-size: 14px;
  }

  button:hover {
    background: #4f46e5;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #setup {
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
  }

  #punchline {
    color: #6366f1;
    font-size: 18px;
  }

  #error {
    color: red;
    font-size: 14px;
  }

  #loading {
    color: #555555;
  }

  .spinner {
    display: none;
    margin: 15px auto;
    width: 30px;
    height: 30px;
    border: 4px solid #dddddd;
    border-top: 4px solid #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    100% {
      transform: rotate(360deg);
    }
  }

  #favourites {
    text-align: left;
    padding-left: 25px;
  }

  #favourites li {
    margin-bottom: 12px;
    line-height: 1.5;
  }
</style>
</head>

<body>

<div class="container">

  <h1>😂 Random Joke Fetcher</h1>

  <p>Week 6 - Fetch API & Async/Await</p>

  <button id="loadButton" onclick="loadJoke()">
    Load Joke
  </button>

  <button id="saveButton" onclick="saveJoke()" disabled>
    ❤️ Save Favourite
  </button>

  <div id="spinner" class="spinner"></div>

  <p id="loading"></p>
  <p id="error"></p>

  <h2 id="setup"></h2>
  <p id="punchline"></p>

  <hr>

  <h3>My Favourite Jokes ❤️</h3>

  <ul id="favourites"></ul>

</div>

<script>

let currentJoke = null;

// Get a joke from an API
async function fetchJoke() {

  const urls = [
    "https://official-joke-api.appspot.com/random_joke",
    "https://v2.jokeapi.dev/joke/Any?type=twopart&safe-mode"
  ];

  for (const url of urls) {

    try {

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("HTTP Error: " + response.status);
      }

      const data = await response.json();

      // Official Joke API
      if (data.setup && data.punchline) {
        return {
          setup: data.setup,
          punchline: data.punchline
        };
      }

      // Backup Joke API
      if (data.setup && data.delivery) {
        return {
          setup: data.setup,
          punchline: data.delivery
        };
      }

      throw new Error("Invalid joke data");

    } catch (error) {
      console.error("API failed:", url, error);
    }

  }

  throw new Error("All joke APIs failed");
}


// Load Joke Button
async function loadJoke() {

  const loading = document.getElementById("loading");
  const spinner = document.getElementById("spinner");
  const error = document.getElementById("error");
  const setup = document.getElementById("setup");
  const punchline = document.getElementById("punchline");

  const loadButton = document.getElementById("loadButton");
  const saveButton = document.getElementById("saveButton");

  loading.textContent = "Loading...";
  spinner.style.display = "block";

  error.textContent = "";
  setup.textContent = "";
  punchline.textContent = "";

  currentJoke = null;

  loadButton.disabled = true;
  saveButton.disabled = true;

  try {

    const joke = await fetchJoke();

    setup.textContent = joke.setup;
    punchline.textContent = joke.punchline;

    currentJoke = joke;
    saveButton.disabled = false;

  } catch (err) {

    error.textContent =
      "Sorry! Could not load a joke. Please try again.";

    console.error(err);

  } finally {

    loading.textContent = "";
    spinner.style.display = "none";
    loadButton.disabled = false;

  }
}


// Save Favourite Button
function saveJoke() {

  if (!currentJoke) {
    alert("Please load a joke first!");
    return;
  }

  try {

    let jokes = JSON.parse(
      localStorage.getItem("favoriteJokes") || "[]"
    );

    jokes.push(currentJoke);

    localStorage.setItem(
      "favoriteJokes",
      JSON.stringify(jokes)
    );

    showFavourites();

    alert("Joke saved successfully! ❤️");

  } catch (error) {

    alert("Could not save the joke.");

  }
}


// Display Favourite Jokes
function showFavourites() {

  const list = document.getElementById("favourites");

  list.innerHTML = "";

  try {

    const jokes = JSON.parse(
      localStorage.getItem("favoriteJokes") || "[]"
    );

    jokes.forEach(function(joke) {

      const li = document.createElement("li");

      li.textContent =
        joke.setup + " — " + joke.punchline;

      list.appendChild(li);

    });

  } catch (error) {

    console.error("Could not load favourites", error);

  }
}


// Show saved jokes when page opens
showFavourites();

</script>

</body>
</html>
